name: Android APK

on:
  push:
    branches: [ main, feature/invoice-aging-report ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build HOLLOO PRO+
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source layout
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/ir/billion/holloopro/MainActivity.kt
          test -f app/src/main/java/ir/billion/holloopro/data/AppDatabase.kt
          echo "Source tree verified; no binary source archive is used."

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare persistent release signing
        env:
          HOLLOO_SIGNING_BUNDLE_BASE64: ${{ secrets.HOLLOO_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [ -n "$HOLLOO_SIGNING_BUNDLE_BASE64" ]; then
            echo "$HOLLOO_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/holloo-signing.zip"
            mkdir -p "$RUNNER_TEMP/holloo-signing"
            unzip -q "$RUNNER_TEMP/holloo-signing.zip" -d "$RUNNER_TEMP/holloo-signing"
            test -s "$RUNNER_TEMP/holloo-signing/holloo-release.jks"
            test -s "$RUNNER_TEMP/holloo-signing/signing.env"
            set -a
            . "$RUNNER_TEMP/holloo-signing/signing.env"
            set +a
            echo "HOLLOO_KEYSTORE_PATH=$RUNNER_TEMP/holloo-signing/holloo-release.jks" >> "$GITHUB_ENV"
            echo "HOLLOO_STORE_PASSWORD=$HOLLOO_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HOLLOO_KEY_ALIAS=$HOLLOO_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "HOLLOO_KEY_PASSWORD=$HOLLOO_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HOLLOO_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "Persistent signing secret is not configured; signed release build is skipped."
            echo "HOLLOO_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: ${{ env.HOLLOO_SIGNING_READY == 'true' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload signed release APK
        if: ${{ env.HOLLOO_SIGNING_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOO-PRO-PLUS-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOO-PRO-PLUS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
