name: Package HOLLOO PRO+ PWA
# Includes syntax and regression checks for accounting, invoice aging, import shipment analytics, and bank CSV layouts.
on:
  push:
    branches: [main, feature/invoice-printing, feature/import-shipment-analytics, feature/inventory-lot-tracking, feature/foreign-payable-management, feature/import-capital-planner, feature/import-capital-planner-dates, feature/pwa-full-rollout, feature/pwa-customization-qa]
    paths:
      - 'pwa/**'
      - '.github/workflows/package-pwa.yml'
  pull_request:
    branches: [main, feature/invoice-printing, feature/import-shipment-analytics, feature/foreign-payable-management, feature/import-capital-planner, feature/import-capital-planner-dates]
    paths:
      - 'pwa/**'
      - '.github/workflows/package-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in pwa/*.js; do node --check "$file"; done
          node --test pwa/tests/*.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('pwa/manifest.webmanifest', 'utf8'))"
      - name: Package PWA
        run: zip -qr HOLLOO-PRO-PLUS-PWA.zip pwa
      - name: Upload PWA package
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOO-PRO-PLUS-PWA
          path: HOLLOO-PRO-PLUS-PWA.zip
          retention-days: 30
